name: Publish pre-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        shell: powershell
        run: |
          ./build.ps1
          ./test.ps1
      - name: Publish 0.1.0
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 dist/LiftPaper.exe dist/SHA256SUMS.txt LICENSE --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'LiftPaper 0.1.0' --notes-file docs/release-notes-0.1.0.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed. Existing releases are not overwritten.' }
