name: Build and test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: powershell
        run: ./build.ps1
      - name: Synthetic regression tests
        shell: powershell
        run: ./test.ps1
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LiftPaper-windows
          path: |
            dist/LiftPaper.exe
            dist/SHA256SUMS.txt
            LICENSE
            NOTICE
          if-no-files-found: error
          retention-days: 1
