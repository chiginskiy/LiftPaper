name: Build and test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: powershell
        run: ./build.ps1
      - name: Synthetic regression tests
        shell: powershell
        run: ./test.ps1
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LiftPaper-windows
          path: |
            dist/LiftPaper.exe
            dist/SHA256SUMS.txt
            LICENSE
            NOTICE
          if-no-files-found: error
          retention-days: 1
